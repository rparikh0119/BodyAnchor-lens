<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, initial-scale=1">
<title>Body Anchor</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
  #stage{position:relative;width:600px;height:600px;margin:0 auto;background:#000;}
  canvas{display:block;width:600px;height:600px;}
  .hud{position:absolute;color:#7fe9e0;font-size:13px;line-height:1.5;
    letter-spacing:.02em;text-shadow:0 0 6px rgba(0,255,230,.35);}
  #tl{top:10px;left:12px;}
  #tr{top:10px;right:12px;text-align:right;}
  #bl{bottom:10px;left:12px;max-width:360px;}
  #br{bottom:10px;right:12px;text-align:right;color:#4d8f8a;font-size:11px;}
  .k{color:#3f7d78;}
  .hi{color:#ffd34d;text-shadow:0 0 8px rgba(255,200,60,.5);}
  .warn{color:#ff8a5c;}
  .focusable:focus{outline:none;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="600" height="600"></canvas>
  <div class="hud" id="tl"></div>
  <div class="hud" id="tr"></div>
  <div class="hud" id="bl"></div>
  <div class="hud" id="br"></div>
</div>
<script src="armdata.js"></script>
<script>
(function(){
  "use strict";
  var D = window.ARM;
  if(!D){ document.getElementById('tl').innerHTML='<span class="warn">armdata.js not loaded</span>'; return; }

  function f32(b64){
    var s=atob(b64), n=s.length, u=new Uint8Array(n);
    for(var i=0;i<n;i++) u[i]=s.charCodeAt(i);
    return new Float32Array(u.buffer);
  }
  function u16(b64){
    var s=atob(b64), n=s.length, u=new Uint8Array(n);
    for(var i=0;i<n;i++) u[i]=s.charCodeAt(i);
    return new Uint16Array(u.buffer);
  }

  var POSE_KEYS = Object.keys(D.poses);
  var POSES = POSE_KEYS.map(function(k){ return f32(D.poses[k]); });
  var NAMES = POSE_KEYS.map(function(k){ return D.poseNames[k]; });
  var IDX   = u16(D.index);
  var NV    = D.verts;

  // live vertex buffer, rebuilt each frame from the pose blend
  var CUR = new Float32Array(NV*3);

  var state = {
    poseFrom: 0, poseTo: 0, blend: 1,   // blend 1 means fully at poseTo
    yaw: 0.35, pitch: -0.12,
    anchor: 0,
    spin: true
  };

  // ---- anchor resolve: triangle index + barycentric weights, every frame ----
  // Nothing stores an XYZ. Position is always derived from the live buffer.
  function resolve(a, out){
    var t = a.triLocal, b = a.bary;
    var i0=t[0]*3, i1=t[1]*3, i2=t[2]*3;
    out[0] = CUR[i0  ]*b[0] + CUR[i1  ]*b[1] + CUR[i2  ]*b[2];
    out[1] = CUR[i0+1]*b[0] + CUR[i1+1]*b[1] + CUR[i2+1]*b[2];
    out[2] = CUR[i0+2]*b[0] + CUR[i1+2]*b[1] + CUR[i2+2]*b[2];
    return out;
  }

  function buildCur(){
    var A = POSES[state.poseFrom], B = POSES[state.poseTo], t = state.blend;
    if(t>=1){ CUR.set(B); return; }
    if(t<=0){ CUR.set(A); return; }
    var s = t*t*(3-2*t);           // smoothstep
    for(var i=0;i<NV*3;i++) CUR[i] = A[i] + (B[i]-A[i])*s;
  }

  // ---- projection ----
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W=600, H=600, SCALE=225;
  var proj = new Float32Array(NV*3);   // x, y, depth

  function project(){
    var cy=Math.cos(state.yaw), sy=Math.sin(state.yaw);
    var cp=Math.cos(state.pitch), sp=Math.sin(state.pitch);
    for(var i=0;i<NV;i++){
      var x=CUR[i*3], y=CUR[i*3+1], z=CUR[i*3+2];
      var x1 =  x*cy + z*sy;
      var z1 = -x*sy + z*cy;
      var y1 =  y*cp - z1*sp;
      var z2 =  y*sp + z1*cp;
      proj[i*3]   = W*0.5 + x1*SCALE;
      proj[i*3+1] = H*0.5 - y1*SCALE;
      proj[i*3+2] = z2;
    }
  }
  function projectPoint(p){
    var cy=Math.cos(state.yaw), sy=Math.sin(state.yaw);
    var cp=Math.cos(state.pitch), sp=Math.sin(state.pitch);
    var x1 =  p[0]*cy + p[2]*sy;
    var z1 = -p[0]*sy + p[2]*cy;
    var y1 =  p[1]*cp - z1*sp;
    var z2 =  p[1]*sp + z1*cp;
    return [W*0.5 + x1*SCALE, H*0.5 - y1*SCALE, z2];
  }

  // ---- draw ----
  // Additive display: black is transparent, so everything is bright marks on pure black.
  // No filled surfaces. Points and thin lines only.
  var tmp=[0,0,0];
  function draw(){
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,W,H);

    // depth range for brightness
    var zmin=1e9, zmax=-1e9;
    for(var i=0;i<NV;i++){ var z=proj[i*3+2]; if(z<zmin)zmin=z; if(z>zmax)zmax=z; }
    var zr = (zmax-zmin) || 1;

    // surface as a point cloud
    for(var i=0;i<NV;i++){
      var d = (proj[i*3+2]-zmin)/zr;          // 0 far, 1 near
      var a = 0.12 + d*0.62;
      var s = d>0.72 ? 1.7 : 1.1;
      ctx.fillStyle = 'rgba(90,240,225,'+a.toFixed(3)+')';
      ctx.fillRect(proj[i*3]-s*0.5, proj[i*3+1]-s*0.5, s, s);
    }

    // wire lattice, sparse so it reads as structure not a solid
    ctx.lineWidth=0.5;
    ctx.strokeStyle='rgba(40,150,150,0.30)';
    ctx.beginPath();
    for(var t=0;t<IDX.length;t+=33){
      var a0=IDX[t]*3, b0=IDX[t+1]*3;
      if(a0===undefined||b0===undefined) continue;
      ctx.moveTo(proj[a0],proj[a0+1]);
      ctx.lineTo(proj[b0],proj[b0+1]);
    }
    ctx.stroke();

    // anchors, resolved live from tri + bary
    for(var k=0;k<D.anchors.length;k++){
      var a=D.anchors[k];
      resolve(a,tmp);
      var p=projectPoint(tmp);
      var sel = (k===state.anchor);
      var col = sel ? '255,211,77' : '255,120,90';
      ctx.strokeStyle='rgba('+col+',0.95)';
      ctx.lineWidth = sel?1.6:1.1;
      var r = sel?9:6;
      ctx.beginPath(); ctx.arc(p[0],p[1],r,0,6.2832); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(p[0]-r-5,p[1]); ctx.lineTo(p[0]-r+1,p[1]);
      ctx.moveTo(p[0]+r-1,p[1]); ctx.lineTo(p[0]+r+5,p[1]);
      ctx.moveTo(p[0],p[1]-r-5); ctx.lineTo(p[0],p[1]-r+1);
      ctx.moveTo(p[0],p[1]+r-1); ctx.lineTo(p[0],p[1]+r+5);
      ctx.stroke();
      if(sel){
        ctx.fillStyle='rgba(255,211,77,0.95)';
        ctx.font='11px ui-monospace,monospace';
        ctx.fillText(a.id, p[0]+r+9, p[1]-r-3);
      }
    }
  }

  function hud(){
    var a = D.anchors[state.anchor];
    var poseName = NAMES[state.poseTo];
    document.getElementById('tl').innerHTML =
      'BODY ANCHOR <span class="k">/ live resolve</span><br>' +
      '<span class="k">pose</span> ' + poseName;
    document.getElementById('tr').innerHTML =
      '<span class="k">topology</span> MHR<br>' +
      D.topology.fullVerts.toLocaleString() + ' v <span class="k">/</span> ' +
      D.topology.fullTris.toLocaleString() + ' tri<br>' +
      '<span class="k">shown</span> ' + D.verts.toLocaleString() + ' v';
    var dr = a.driftMm || [];
    document.getElementById('bl').innerHTML =
      '<span class="hi">' + a.id + '</span> <span class="k">' + (a.site||'') +
      (a.alongPct!=null ? ' &middot; ' + a.alongPct + '% wrist to elbow' : '') + '</span><br>' +
      '<span class="k">tri</span> ' + a.tri +
      ' <span class="k">bary</span> [' + a.bary.join(', ') + ']<br>' +
      '<span class="k">drift vs A</span> ' +
      (dr.length ? dr.map(function(x){return x.toFixed(1)+' mm';}).join(' <span class="k">/</span> ') : 'n/a') +
      ' <span class="warn">&#9679; provisional</span>';
    document.getElementById('br').innerHTML =
      'LEFT RIGHT rotate <br> UP DOWN select anchor <br> ENTER change pose';
  }

  // ---- input: D-pad only. No Escape anywhere. ----
  var held = {};
  window.addEventListener('keydown', function(e){
    var k=e.key;
    if(k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown'||k==='Enter'){
      e.preventDefault();
    }
    if(k==='ArrowLeft'||k==='ArrowRight'){ held[k]=true; state.spin=false; }
    if(k==='ArrowUp'){   state.anchor=(state.anchor+D.anchors.length-1)%D.anchors.length; hud(); }
    if(k==='ArrowDown'){ state.anchor=(state.anchor+1)%D.anchors.length; hud(); }
    if(k==='Enter'){
      if(state.blend>=1){
        state.poseFrom = state.poseTo;
        state.poseTo   = (state.poseTo+1) % POSES.length;
        state.blend    = 0;
        hud();
      }
    }
  });
  window.addEventListener('keyup', function(e){ held[e.key]=false; });

  // ---- loop ----
  var last=performance.now(), fps=0, acc=0, frames=0;
  function tick(now){
    var dt=Math.min((now-last)/1000,0.1); last=now;
    frames++; acc+=dt;
    if(acc>=0.5){ fps=Math.round(frames/acc); frames=0; acc=0; }

    if(held['ArrowLeft'])  state.yaw -= dt*1.6;
    if(held['ArrowRight']) state.yaw += dt*1.6;
    if(state.spin)         state.yaw += dt*0.25;
    if(state.blend<1){ state.blend = Math.min(1, state.blend + dt*0.9); }

    buildCur();
    project();
    draw();

    ctx.fillStyle='rgba(60,130,130,0.8)';
    ctx.font='10px ui-monospace,monospace';
    ctx.fillText(fps+' fps', 278, 592);

    requestAnimationFrame(tick);
  }
  buildCur(); hud(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
