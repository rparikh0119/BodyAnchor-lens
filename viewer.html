<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1">
<title>Body Anchor Viewer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='5' fill='%234FD8E8'/></svg>">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  html,body{width:600px;height:600px;overflow:hidden;background:#000;
    color:#EAF6F8;font:15px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  #stage{position:relative;width:600px;height:600px}
  canvas{display:block;width:600px;height:600px}

  .hud{position:absolute;pointer-events:none}
  #top{top:24px;left:26px}
  #top h1{font-size:14px;letter-spacing:.22em;font-weight:600;color:#fff}
  #top p{font-size:11px;letter-spacing:.12em;color:#7F9AA2;margin-top:3px}

  #sel{bottom:74px;left:26px;right:26px}
  #sel .id{font-size:12px;letter-spacing:.16em;color:#4FD8E8;font-weight:600}
  #sel .nm{font-size:19px;color:#fff;letter-spacing:.02em;margin-top:2px}
  #sel .mm{font-size:13px;color:#F2B279;margin-top:3px;font-variant-numeric:tabular-nums}

  #bar{bottom:24px;left:26px;right:26px;display:flex;justify-content:space-between;
    font-size:11px;letter-spacing:.1em;color:#7F9AA2}
  #bar b{color:#4FD8E8;font-weight:400}

  /* keyboard target: the whole stage takes D-pad focus */
  #stage.focusable:focus{outline:none}
  #stage.focusable:focus-visible::after{content:"";position:absolute;inset:2px;
    border:1px solid #4FD8E8;pointer-events:none}
</style>
</head>
<body>
<div id="stage" class="focusable" tabindex="0">
  <canvas id="c" width="600" height="600"></canvas>

  <div class="hud" id="top">
    <h1>BODY ANCHOR</h1>
    <p>FOREARM_L &middot; SUBJECT_01 &middot; CAPTURE 12</p>
  </div>

  <div class="hud" id="sel">
    <div class="id" id="sId">A01</div>
    <div class="nm" id="sNm">Laceration, volar mid</div>
    <div class="mm" id="sMm">7mm &middot; tri 3028</div>
  </div>

  <div class="hud" id="bar">
    <span>&larr;&rarr; rotate &middot; &uarr;&darr; anchor &middot; <b>pinch</b> to flex</span>
    <span id="fps">--</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
var TAU = Math.PI * 2;

/* ---- topology (same constants as the desktop viewer) ---- */
var SEG = 72, RING = 40, VW = RING + 1;
var TRIS = SEG * RING * 2;
var indices = new Uint32Array(TRIS * 3);
(function(){ var k = 0;
  for (var i = 0; i < SEG; i++) for (var j = 0; j < RING; j++) {
    var a=i*VW+j, b=i*VW+j+1, c=(i+1)*VW+j, d=(i+1)*VW+j+1;
    indices[k++]=a; indices[k++]=c; indices[k++]=b;
    indices[k++]=b; indices[k++]=c; indices[k++]=d;
  }})();
function addressFromTPhi(t, phi){
  t = Math.min(0.9999, Math.max(0, t));
  var pr = ((phi % TAU) + TAU) % TAU;
  var fi = t*SEG, i = Math.floor(fi), u = fi - i;
  var fj = pr/TAU*RING, j = Math.floor(fj), v = fj - j;
  if (i>=SEG){i=SEG-1;u=1;} if (j>=RING){j=RING-1;v=1;}
  var q = i*RING + j;
  if (u+v <= 1) return {tri:2*q,   bary:[1-u-v, u, v]};
  return             {tri:2*q+1, bary:[1-u, 1-v, u+v-1]};
}
function resolve3(out, o, pos, tri, w){
  var t3=tri*3, i0=indices[t3]*3, i1=indices[t3+1]*3, i2=indices[t3+2]*3;
  out[o]   = pos[i0]*w[0]   + pos[i1]*w[1]   + pos[i2]*w[2];
  out[o+1] = pos[i0+1]*w[0] + pos[i1+1]*w[1] + pos[i2+1]*w[2];
  out[o+2] = pos[i0+2]*w[0] + pos[i1+2]*w[1] + pos[i2+2]*w[2];
}

/* ---- shape ---- */
var PROF=[[0,.126],[.16,.117],[.28,.101],[.38,.103],[.50,.109],[.62,.099],[.74,.080],[.86,.059],[.94,.051],[1,.050]];
function baseR(t){
  for (var i=1;i<PROF.length;i++){ if (t<=PROF[i][0]){
    var a=PROF[i-1], b=PROF[i], k=(t-a[0])/(b[0]-a[0]); k=k*k*(3-2*k);
    return a[1]+(b[1]-a[1])*k; } }
  return PROF[PROF.length-1][1];
}
function domeK(t){
  var k=1;
  if (t<.05)  k=Math.sqrt(Math.max(0,1-Math.pow((.05-t)/.05,2)))*.97+.03;
  if (t>.955) k=Math.min(k, Math.sqrt(Math.max(0,1-Math.pow((t-.955)/.045,2)))*.97+.03);
  return k;
}
var bendW = new Float32Array(SEG+1);
(function(){ var s=0,i;
  for(i=0;i<=SEG;i++){var t=i/SEG; bendW[i]=Math.exp(-Math.pow((t-.34)/.085,2)); s+=bendW[i];}
  for(i=0;i<=SEG;i++) bendW[i]/=s; })();
var stX=new Float32Array(SEG+1), stY=new Float32Array(SEG+1), stA=new Float32Array(SEG+1);
function stations(bendDeg){
  var ang=0, x=-0.50, y=-0.05, dl=1/SEG, bend=bendDeg*Math.PI/180;
  for(var i=0;i<=SEG;i++){ stX[i]=x; stY[i]=y; stA[i]=ang;
    ang += bend*bendW[i]; x += Math.cos(ang)*dl; y += Math.sin(ang)*dl; }
}
var pos = new Float32Array((SEG+1)*VW*3);
function surface(){
  for(var i=0;i<=SEG;i++){
    var t=i/SEG, a=stA[i], bx=Math.sin(a), by=-Math.cos(a);
    var r0=baseR(t)*domeK(t), px=stX[i], py=stY[i];
    for(var j=0;j<=RING;j++){
      var phi=(j%RING)/RING*TAU, cx=Math.cos(phi), sx=Math.sin(phi);
      var o=(i*VW+j)*3;
      pos[o]=px+r0*sx*bx; pos[o+1]=py+r0*sx*by; pos[o+2]=r0*cx;
    }
  }
}

/* ---- anchors ---- */
function mk(t,phi,id,nm,mm){ var a=addressFromTPhi(t,phi);
  return {id:id, nm:nm, mm:mm, tri:a.tri, bary:a.bary}; }
var anchors = [
  mk(.52,-0.90,"A01","Laceration, volar mid","7mm · was 41mm"),
  mk(.40,-1.30,"A02","Edema margin","0mm · resolved"),
  mk(.84,-0.35,"A03","Radial pulse point","landmark")
];
var sel = 0;

/* ---- scene: additive display, so lines and points only, no lit mesh ---- */
var canvas = document.getElementById("c");
var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:false});
renderer.setPixelRatio(1);
renderer.setSize(600,600,false);
renderer.setClearColor(0x000000,1);
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(34,1,.05,40);

function dotTex(){
  var c=document.createElement("canvas"); c.width=c.height=32;
  var g=c.getContext("2d"), gr=g.createRadialGradient(16,16,0,16,16,16);
  gr.addColorStop(0,"rgba(255,255,255,1)"); gr.addColorStop(.35,"rgba(255,255,255,.7)");
  gr.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle=gr; g.fillRect(0,0,32,32); return new THREE.CanvasTexture(c);
}
var DOT = dotTex();

/* splat cloud, each sample stored as an address */
var NPTS = 5000;
var sTri=new Int32Array(NPTS), sW=new Float32Array(NPTS*3);
(function(){ var s=20260924;
  function rnd(){ s=(s*1664525+1013904223)&0x7fffffff; return s/0x7fffffff; }
  for(var p=0;p<NPTS;p++){ sTri[p]=(rnd()*TRIS)|0;
    var r1=Math.sqrt(rnd()), r2=rnd();
    sW[p*3]=1-r1; sW[p*3+1]=r1*(1-r2); sW[p*3+2]=r1*r2; } })();
var ptPos = new Float32Array(NPTS*3);
var ptGeo = new THREE.BufferGeometry();
ptGeo.setAttribute("position", new THREE.BufferAttribute(ptPos,3));
scene.add(new THREE.Points(ptGeo, new THREE.PointsMaterial({
  size:.011, map:DOT, color:0xF2B279, transparent:true, opacity:1,
  depthWrite:false, blending:THREE.AdditiveBlending })));

/* wire lattice */
var wp=[];
(function(){
  for(var i=0;i<=SEG;i+=8) for(var j=0;j<RING;j++) wp.push(i*VW+j, i*VW+j+1);
  for(var j2=0;j2<RING;j2+=6) for(var i2=0;i2<SEG;i2++) wp.push(i2*VW+j2,(i2+1)*VW+j2);
})();
var wPos = new Float32Array(wp.length*3);
var wGeo = new THREE.BufferGeometry();
wGeo.setAttribute("position", new THREE.BufferAttribute(wPos,3));
scene.add(new THREE.LineSegments(wGeo, new THREE.LineBasicMaterial({
  color:0x4FD8E8, transparent:true, opacity:.22, depthWrite:false,
  blending:THREE.AdditiveBlending })));

/* anchors */
var aPos = new Float32Array(anchors.length*3);
var aGeo = new THREE.BufferGeometry();
aGeo.setAttribute("position", new THREE.BufferAttribute(aPos,3));
scene.add(new THREE.Points(aGeo, new THREE.PointsMaterial({
  size:9, map:DOT, color:0x8FF0FA, transparent:true, opacity:.9,
  sizeAttenuation:false, depthWrite:false, blending:THREE.AdditiveBlending })));
var selPos = new Float32Array(3);
var selGeo = new THREE.BufferGeometry();
selGeo.setAttribute("position", new THREE.BufferAttribute(selPos,3));
scene.add(new THREE.Points(selGeo, new THREE.PointsMaterial({
  size:34, map:DOT, color:0x4FD8E8, transparent:true, opacity:.85,
  sizeAttenuation:false, depthWrite:false, blending:THREE.AdditiveBlending })));

/* ---- input: arrow keys and Enter, which is what the band sends ---- */
var theta = 0.34, bendTarget = 0, bend = 0;
window.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ theta -= 0.22; e.preventDefault(); }
  else if (e.key === "ArrowRight"){ theta += 0.22; e.preventDefault(); }
  else if (e.key === "ArrowUp"){ sel = (sel-1+anchors.length)%anchors.length; label(); e.preventDefault(); }
  else if (e.key === "ArrowDown"){ sel = (sel+1)%anchors.length; label(); e.preventDefault(); }
  else if (e.key === "Enter"){ bendTarget = bendTarget > 60 ? 0 : 105; e.preventDefault(); }
  else if (e.key === "Escape"){ theta = 0.34; bendTarget = 0; e.preventDefault(); }
});
function label(){
  var a = anchors[sel];
  document.getElementById("sId").textContent = a.id;
  document.getElementById("sNm").textContent = a.nm;
  document.getElementById("sMm").textContent = a.mm + " · tri " + a.tri;
}
label();
document.getElementById("stage").focus();

/* ---- frame ---- */
var target = new THREE.Vector3();
var fpsEl = document.getElementById("fps");
var frames = 0, t0 = performance.now();

function tick(){
  requestAnimationFrame(tick);
  bend += (bendTarget - bend) * 0.12;

  stations(bend);
  surface();

  var i;
  for(i=0;i<NPTS;i++) resolve3(ptPos, i*3, pos, sTri[i], [sW[i*3],sW[i*3+1],sW[i*3+2]]);
  ptGeo.attributes.position.needsUpdate = true;
  ptGeo.computeBoundingSphere();

  for(i=0;i<wp.length;i++){ var vi=wp[i]*3, o=i*3;
    wPos[o]=pos[vi]; wPos[o+1]=pos[vi+1]; wPos[o+2]=pos[vi+2]; }
  wGeo.attributes.position.needsUpdate = true;
  wGeo.computeBoundingSphere();

  for(i=0;i<anchors.length;i++){
    resolve3(aPos, i*3, pos, anchors[i].tri, anchors[i].bary);
    if (i === sel){ selPos[0]=aPos[i*3]; selPos[1]=aPos[i*3+1]; selPos[2]=aPos[i*3+2]; }
  }
  aGeo.attributes.position.needsUpdate = true; aGeo.computeBoundingSphere();
  selGeo.attributes.position.needsUpdate = true; selGeo.computeBoundingSphere();

  // keep the limb framed at any flexion
  var cx=0, cy=0, R=0;
  for(i=0;i<=SEG;i++){ cx+=stX[i]; cy+=stY[i]; }
  cx/=(SEG+1); cy/=(SEG+1);
  target.set(cx, cy, 0);
  for(i=0;i<=SEG;i++){ var d=Math.hypot(stX[i]-cx, stY[i]-cy); if(d>R) R=d; }
  R += 0.17;
  var hv = camera.fov*Math.PI/360;
  var dist = (R/Math.tan(hv)) * 1.10;
  var phiC = 1.18, sp = Math.sin(phiC);
  camera.position.set(cx + dist*sp*Math.sin(theta), cy + dist*Math.cos(phiC), dist*sp*Math.cos(theta));
  camera.lookAt(target);

  renderer.render(scene, camera);

  frames++;
  var now = performance.now();
  if (now - t0 >= 1000){
    fpsEl.textContent = Math.round(frames*1000/(now-t0)) + " fps";
    frames = 0; t0 = now;
  }
}
tick();
</script>
</body>
</html>
